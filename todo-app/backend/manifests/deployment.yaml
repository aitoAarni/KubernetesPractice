apiVersion: apps/v1
kind: Deployment
metadata:
    name: todo-app-backend
    namespace: project
spec:
    replicas: 1
    selector:
        matchLabels:
            app: todo-app-backend
    template:
        metadata:
            labels:
                app: todo-app-backend
        spec:
            volumes:
                - name: image-volume
                  persistentVolumeClaim:
                      claimName: image-claim
            containers:
                - name: todo-app-backend
                  image: aitoaarni/todo-app-backend:2.10
                  imagePullPolicy: Always
                  volumeMounts:
                      - name: image-volume
                        mountPath: /app/volume
                  ports:
                      - containerPort: 3000
                  env:
                      - name: PORT
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: PORT
                      - name: IMAGE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: IMAGE_URL
                      - name: IMAGE_PATH
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: IMAGE_PATH
                      - name: DB_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: DB_HOST
                      - name: DB_PORT
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: DB_PORT
                      - name: DB_USER
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: DB_USER
                      - name: DB_PASSWORD
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: DB_PASSWORD
                      - name: DB_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: todo-app-backend-config
                                key: DB_NAME
