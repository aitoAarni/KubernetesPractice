apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres-stset
    namespace: exercises
spec:
    serviceName: postgres-svc
    replicas: 1
    selector:
        matchLabels:
            app: postgresapp
    template:
        metadata:
            labels:
                app: postgresapp
        spec:
            containers:
                - name: postgres
                  image: postgres:16
                  ports:
                      - name: web
                        containerPort: 5432
                  env:
                      - name: POSTGRES_DB
                        value: "mydb"
                      - name: POSTGRES_USER
                        value: "myuser"
                      - name: POSTGRES_PASSWORD
                        value: "mypassword"
                      - name: PGDATA
                        value: "/var/lib/postgresql/data/pgdata"
                  volumeMounts:
                      - name: postgres-data-storage
                        mountPath: /var/lib/postgresql/data
    volumeClaimTemplates:
        - metadata:
              name: postgres-data-storage
          spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: standard-rwo # changed from local-path
              resources:
                  requests:
                      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
    name: postgres-svc
    namespace: exercises
    labels:
        app: postgres
spec:
    ports:
        - port: 5432
          name: web
    clusterIP: None
    selector:
        app: postgresapp
