apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres-stset
    namespace: exercises
spec:
    serviceName: postgres-svc
    replicas: 1
    selector:
        matchLabels:
            app: postgresapp
    template:
        metadata:
            labels:
                app: postgresapp
        spec:
            containers:
                - name: postgres
                  image: postgres:16
                  ports:
                      - name: postgres
                        containerPort: 5432
                  env:
                      - name: POSTGRES_DB
                        value: "mydb"
                      - name: POSTGRES_USER
                        value: "myuser"
                      - name: POSTGRES_PASSWORD
                        value: "mypassword"
                      - name: PGDATA
                        value: "/var/lib/postgresql/data/pgdata"
                  volumeMounts:
                      - name: postgres-data-storage
                        mountPath: /var/lib/postgresql/data
                  # Add readiness probe to ensure DB is ready before pingpong connects
                  readinessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -U
                              - myuser
                              - -d
                              - mydb
                      initialDelaySeconds: 15
                      periodSeconds: 5
                  livenessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -U
                              - myuser
                              - -d
                              - mydb
                      initialDelaySeconds: 30
                      periodSeconds: 10
    volumeClaimTemplates:
        - metadata:
              name: postgres-data-storage
          spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: standard-rwo

              resources:
                  requests:
                      storage: 100Mi
