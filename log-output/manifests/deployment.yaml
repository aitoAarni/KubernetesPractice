apiVersion: apps/v1
kind: Deployment
metadata:
    name: hashgenerator-dep

spec:
    replicas: 1
    selector:
        matchLabels:
            app: logoutput
    template:
        metadata:
            labels:
                app: logoutput

        spec:
            volumes:
                - name: shared-file
                  emptyDir: {}
                
                - name: persistent-volume
                  persistentVolumeClaim:
                    claimName: image-claim1

            containers:
                - name: logoutput-endpoint
                  image: aitoaarni/logoutput-endpoint:1.11
                  ports:
                      - containerPort: 8000
                  volumeMounts:
                      - name: shared-file
                        mountPath: /usr/src/app/volume

                      - name: persistent-volume
                        mountPath: /usr/src/app/persistentVolume

                - name: logoutput
                  image: aitoaarni/logoutput:1.10

                  volumeMounts:
                      - name: shared-file
                        mountPath: /usr/src/app/volume
